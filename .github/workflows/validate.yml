name: Validate notebooks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nbformat
        run: pip install nbformat
      - name: Validate + syntax-check every notebook
        run: |
          python - <<'PY'
          import ast
          import glob

          import nbformat

          failed = False
          for path in sorted(glob.glob("**/*.ipynb", recursive=True)):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type != "code":
                      continue
                  src = cell.source
                  try:
                      ast.parse(src)
                  except SyntaxError:
                      # Notebooks use top-level await; wrap to compile-check.
                      try:
                          ast.parse("async def _w():\n" + "\n".join("    " + l for l in src.splitlines()))
                      except SyntaxError as exc:
                          print(f"::error file={path}::cell {i}: {exc}")
                          failed = True
              print(f"ok {path}")
          raise SystemExit(1 if failed else 0)
          PY
