name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the scan covers every commit
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for committed secrets
        run: gitleaks detect --source . --redact --no-banner --verbose

  notebooks:
    name: Validate notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install nbformat
        run: pip install nbformat
      - name: Validate schema and cell syntax
        run: |
          python - <<'PY'
          import ast
          import glob
          import sys

          import nbformat

          # Notebooks keep their execution outputs on purpose so readers can see
          # the results/charts without running anything. We only check that each
          # notebook is well-formed and that code cells parse.
          failed = False
          for path in sorted(glob.glob("**/*.ipynb", recursive=True)):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type != "code":
                      continue
                  src = cell.source
                  try:
                      ast.parse(src)
                  except SyntaxError:
                      # Notebooks use top-level await; wrap to compile-check.
                      try:
                          ast.parse("async def _cell():\n" + "\n".join("    " + line for line in src.splitlines()))
                      except SyntaxError as exc:
                          print(f"::error file={path}::cell {i}: {exc}")
                          failed = True
              print(f"ok {path}")
          sys.exit(1 if failed else 0)
          PY
